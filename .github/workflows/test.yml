name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y lua5.4
      - run: node test/layout.test.js
      - run: node test/clients.test.js
      - run: lua5.4 test/layout_test.lua
